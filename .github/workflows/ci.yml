name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-pipeline:
    name: Data generation + dbt (DuckDB) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt
          pip install "dbt-core==1.10.22" "dbt-duckdb==1.10.0"

      - name: Generate sample data (smoke scale)
        run: python -m generator --scale smoke --overwrite

      - name: dbt build (DuckDB) — models + 141 tests
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: "."
        run: dbt build --target duckdb

  web:
    name: Portfolio site — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
