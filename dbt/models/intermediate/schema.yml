version: 2

models:
  - name: int_order_items_agg
    description: Order-line sums used for header reconciliation.
    columns:
      - name: order_id
        tests: [not_null, unique]

  - name: int_session_funnel
    description: Ordered, same-session four-step funnel.
    columns:
      - name: session_id
        tests: [not_null, unique]

  - name: int_sessions_enriched
    description: Sessions with point-in-time new/existing/anonymous classification.
    columns:
      - name: session_id
        tests: [not_null, unique]
      - name: customer_type
        tests:
          - accepted_values:
              arguments:
                values: [new, existing, anonymous]

  - name: int_order_touchpoints
    description: >
      Recomputed 30-day session touchpoints with last non-direct and linear credit.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fact_orders')
                field: order_id
      - name: session_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fact_sessions')
                field: session_id
      - name: touchpoint_sequence
        tests: [not_null]

  - name: int_content_sessions
    description: One row per content and exposed session with downstream actions.
    columns:
      - name: metric_date
        tests: [not_null]
      - name: session_id
        tests: [not_null]
      - name: content_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_content')
                field: content_id
